<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Soleco Apps</title>
  <meta name="description" content="Portail des applications métiers Soleco.">
  <meta name="theme-color" content="#161616">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soleco Apps">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@400;600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #161616; --surface: #1e1e1e; --surface-2: #262626; --surface-sunk: #151515;
      --text: #ededed; --muted: #a8a8a8;
      --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.20);
      --accent: #fcdc49; --accent-weak: rgba(252,220,73,.14); --accent-text: #181818;
      --ok: #6bbf59; --danger: #e5706b;
      --radius: 14px; --radius-sm: 9px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.35);
    }
    :root[data-theme="light"] {
      --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --surface-sunk: #f8f9fb;
      --text: #1c1e21; --muted: #6b7280;
      --border: rgba(0,0,0,.10); --border-strong: rgba(0,0,0,.22);
      --accent: #b8860b; --accent-weak: rgba(184,134,11,.12); --accent-text: #ffffff;
      --ok: #1a7f37; --danger: #c0392b;
      --shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 34px rgba(0,0,0,.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font); color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(252,220,73,.08), transparent 60%),
        radial-gradient(900px 500px at 110% 0%, rgba(255,120,44,.06), transparent 55%),
        var(--bg);
    }

    button, .btn {
      font: inherit; cursor: pointer; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface-2); color: inherit; padding: 7px 12px;
    }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
    button.small { padding: 4px 9px; font-size: 12px; }
    button[disabled] { opacity: .5; cursor: default; }
    input, select {
      font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; color: inherit;
      border: 1px solid var(--border); background: var(--surface-sunk);
    }
    input[type="color"] { padding: 2px; height: 34px; }
    input[type="checkbox"], input[type="radio"] { width: auto; }
    label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
    .lnk { color: var(--accent); cursor: pointer; font-size: 13px; }
    .sub { color: var(--muted); font-size: 13px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .hidden { display: none !important; }
    h2.sec { margin: 0 0 14px; font-size: 18px; }
    h3 { font-size: 13px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ---- shell : sidebar fixe (admin) + topbar ---- */
    #side {
      position: fixed; left: 0; top: 0; bottom: 0; width: 214px; z-index: 40;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 14px 12px; display: flex; flex-direction: column;
    }
    #side .side-brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 14px; font-weight: 800; }
    #side .side-brand img { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; }
    #sideNav { display: flex; flex-direction: column; gap: 3px; }
    #sideNav button { text-align: left; background: transparent; border: 0; padding: 9px 10px; border-radius: 8px; color: inherit; }
    #sideNav button:hover { background: var(--surface-2); }
    #sideNav button.active { background: var(--accent-weak); font-weight: 700; }
    .side-foot { margin-top: auto; padding-top: 12px; font-size: 12px; color: var(--muted); }
    #sideVersion { opacity: .7; letter-spacing: .02em; }

    #shell { min-height: 100vh; transition: padding-left .15s ease; }
    body.has-side #shell { padding-left: 214px; }

    #topbar {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    #topbar .tb-logo { width: 26px; height: 26px; border-radius: 7px; object-fit: contain; }
    #topbar .tb-title { font-weight: 800; font-size: 14px; }
    #topbar .tb-spacer { flex: 1; }
    #topbar .tb-status { font-size: 12px; color: var(--muted); max-width: 30vw; text-align: right; }
    #who { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
    #who b { color: var(--text); }
    #themeBtn { padding: 5px 9px; }

    #main { padding: 22px 18px 48px; max-width: 1080px; margin: 0 auto; }
    .page-head { margin-bottom: 18px; }
    .page-head h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
    .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    .card { max-width: 420px; margin: 5vh auto 0; padding: 24px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card h2 { margin: 0 0 4px; }
    .jg { display: flex; gap: 4px; margin-top: 6px; }
    .jg i { flex: 1; height: 6px; border-radius: 999px; background: var(--border); }
    .jg i.on { background: #e0a83b; } .jg i.on.s3 { background: #6bbf59; } .jg i.on.s4 { background: #3a9d3a; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .tile {
      display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px;
      min-height: 150px; padding: 18px; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: var(--radius); box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease; color: inherit;
    }
    .tile:hover, .tile:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .tile .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
    .tile h3 { margin: 0; font-size: 19px; line-height: 1.1; color: var(--text); text-transform: none; letter-spacing: 0; }
    .tile p { margin: 0; color: var(--muted); font-size: 13px; }
    .tile .go { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--accent); }
    .tile .arrow { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
      background: var(--accent-weak); border: 1px solid var(--border-strong); font-size: 16px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); }
    .tag.warn { color: var(--danger); border-color: var(--danger); }
    .tag.ok { color: var(--ok); }
    .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }

    .cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin: 8px 0 4px; }
    .cfg-item { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }

    dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
      color: var(--text); max-width: 480px; width: 92vw; padding: 20px; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(0,0,0,.6); }

    #status { opacity: 0; transition: opacity .15s; }
    #status.on { opacity: 1; }

    @media (max-width: 820px) {
      #side { transform: translateX(-100%); transition: transform .2s ease; }
      body.side-open #side { transform: none; }
      body.has-side #shell { padding-left: 0; }
      #topbar .menu-toggle { display: inline-flex; }
      .grid { grid-template-columns: 1fr; }
      #main { padding: 16px 12px 40px; }
    }
    #topbar .menu-toggle { display: none; }
  </style>
</head>
<body>
  <aside id="side" class="hidden">
    <div class="side-brand"><img src="assets/icon-512.png" alt=""><span>Soleco Apps</span></div>
    <nav id="sideNav">
      <button data-panel="accueil" class="active">Accueil</button>
      <button data-panel="comptes">Comptes</button>
      <button data-panel="applications">Applications</button>
      <button data-panel="apercu">Aperçu par compte</button>
      <button data-panel="gestion">Gestion de la page</button>
    </nav>
    <div class="side-foot"><div id="sideVersion"></div></div>
  </aside>

  <div id="shell">
    <header id="topbar">
      <button class="small menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <img class="tb-logo" src="assets/icon-512.png" alt="">
      <span class="tb-title" id="tbTitle">Soleco Apps</span>
      <span class="tb-spacer"></span>
      <span class="tb-status" id="status"></span>
      <div id="who" class="hidden"></div>
      <button id="themeBtn" class="small" title="Thème clair / sombre" aria-label="Thème">◐</button>
    </header>

    <main id="main">
      <div id="gate"></div>
      <div id="app" class="hidden">
        <section id="view-accueil">
          <div class="page-head"><h1 id="heroTitle">Soleco Apps</h1><p id="heroSub">Point d'entrée des applications métiers.</p></div>
          <div class="grid" id="tiles" aria-label="Applications"></div>
        </section>
        <section id="view-comptes" class="hidden"><div class="page-head"><h1>Comptes</h1></div><div id="adminComptes"></div></section>
        <section id="view-applications" class="hidden"><div class="page-head"><h1>Applications</h1></div><div id="adminApps"></div></section>
        <section id="view-apercu" class="hidden"><div class="page-head"><h1>Aperçu par compte</h1><p>Ce que verrait un compte donné en se connectant.</p></div><div id="adminApercu"></div></section>
        <section id="view-gestion" class="hidden"><div class="page-head"><h1>Gestion de la page</h1><p>Couleurs, police et textes du portail.</p></div><div id="gestion"></div></section>
      </div>
    </main>
  </div>

  <dialog id="dlg"></dialog>

  <script>
  var VERSION = 'v1.3.0';
  var FONTS = {
    'Système': '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif',
    'Inter': '"Inter", system-ui, sans-serif',
    'Roboto': '"Roboto", system-ui, sans-serif',
    'Poppins': '"Poppins", system-ui, sans-serif',
    'Georgia': 'Georgia, "Times New Roman", serif'
  };

  (function () {
    var root = document.documentElement, saved = null;
    try { saved = localStorage.getItem('soleco-theme'); } catch (e) {}
    if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').addEventListener('click', function () {
      var next = (root.getAttribute('data-theme') === 'light') ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('soleco-theme', next); } catch (e) {}
    });
  })();

  (function () {
    'use strict';
    var SB = 'https://bsrijihrkhhhhfnngryl.supabase.co';
    var KEY = 'sb_publishable_YZFYuqQsfYgC-pSxLU4qOg_L0TGr_XF';
    var APP = 'PORTAIL';
    var STORE = 'soleco-token';
    var TOKEN = null, CTX = null, UA = '', CFG = [];
    try { UA = navigator.userAgent; } catch (e) {}
    try { TOKEN = localStorage.getItem(STORE); } catch (e) {}

    var $ = function (s, r) { return (r || document).querySelector(s); };
    var esc = function (v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    };
    var statusEl = $('#status');
    function setStatus(m) { statusEl.textContent = m || ''; statusEl.classList.toggle('on', !!m); }

    function rpc(fn, body) {
      return fetch(SB + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      }).then(function (r) {
        return r.text().then(function (t) {
          if (r.ok) return t ? JSON.parse(t) : null;
          var m = t; try { var j = JSON.parse(t); m = j.message || j.hint || j.details || t; } catch (e) {}
          throw new Error(m || ('Erreur ' + r.status));
        });
      });
    }

    /* ---------- apparence (portail_config) ---------- */
    var CVAR = { bg: '--bg', surface: '--surface', surface2: '--surface-2', text: '--text',
      muted: '--muted', border: '--border', accent: '--accent', accent_text: '--accent-text' };
    function cfgGet(cle) { var r = CFG.filter(function (x) { return x.cle === cle; })[0]; return r ? (r.valeur || r.defaut) : null; }
    function appliquerConfig(paires) {
      // paires : { cle: valeur-effective } ; sinon on lit CFG
      var val = paires || {};
      function v(cle) { return (cle in val) ? val[cle] : cfgGet(cle); }
      var dark = [], light = [];
      Object.keys(CVAR).forEach(function (k) {
        var vd = v('sombre_' + k), vl = v('clair_' + k);
        if (vd) { dark.push(CVAR[k] + ':' + vd); if (k === 'accent') dark.push('--accent-weak:' + vd + '26'); }
        if (vl) { light.push(CVAR[k] + ':' + vl); if (k === 'accent') light.push('--accent-weak:' + vl + '22'); }
      });
      var fam = FONTS[v('police')] || FONTS['Système'];
      var css = ':root{--font:' + fam + (dark.length ? ';' + dark.join(';') : '') + '}' +
        (light.length ? ':root[data-theme="light"]{' + light.join(';') + '}' : '');
      var st = document.getElementById('cfg-css') ||
        (function () { var s = document.createElement('style'); s.id = 'cfg-css'; document.head.appendChild(s); return s; })();
      st.textContent = css;
      var t = v('titre'), sub = v('sous_titre');
      if (t) { $('#heroTitle').textContent = t; $('#tbTitle').textContent = t; document.title = t; }
      if (sub) $('#heroSub').textContent = sub;
    }
    function chargerConfig() {
      return rpc('portail_config_lire', {}).then(function (rows) { CFG = rows || []; appliquerConfig(); })
        .catch(function () {});
    }

    /* ---------- robustesse mot de passe ---------- */
    function jauge(v, login, nom) {
      v = v || ''; var f = 0;
      if (/[a-z]/.test(v)) f++; if (/[A-Z]/.test(v)) f++;
      if (/[0-9]/.test(v)) f++; if (/[^a-zA-Z0-9]/.test(v)) f++;
      var loc = String(login || '').split('@')[0].toLowerCase(), pb = [];
      if (v.length < 10) pb.push('10 caractères minimum');
      if (f < 3) pb.push('mélanger 3 types (minuscule / majuscule / chiffre / symbole)');
      if (loc.length >= 3 && v.toLowerCase().indexOf(loc) >= 0) pb.push('sans ton identifiant');
      if (nom && nom.length >= 3 && v.toLowerCase().indexOf(String(nom).toLowerCase()) >= 0) pb.push('sans ton nom');
      var s = Math.min(4, (v.length >= 10 ? 1 : 0) + (v.length >= 14 ? 1 : 0) + Math.max(0, f - 1));
      return { ok: !pb.length, score: pb.length ? Math.min(s, 2) : Math.max(s, 3), pb: pb };
    }
    function mdpFields(id) {
      return '<label class="f">Nouveau mot de passe</label><input type="password" id="' + id + 'a">' +
        '<div class="jg" id="' + id + 'j"><i></i><i></i><i></i><i></i></div>' +
        '<p class="sub" id="' + id + 'h" style="margin:4px 0 0"></p>' +
        '<label class="f">Confirmer</label><input type="password" id="' + id + 'b">';
    }
    function mdpWire(rt, id, login, nom, onok) {
      var a = $('#' + id + 'a', rt), b = $('#' + id + 'b', rt), j = $('#' + id + 'j', rt), h = $('#' + id + 'h', rt);
      function maj() {
        var r = jauge(a.value, login, nom);
        [].forEach.call(j.children, function (el, i) { el.className = i < r.score ? ('on s' + r.score) : ''; });
        h.textContent = r.pb.length ? ('Il manque : ' + r.pb.join(' · '))
          : (b.value && b.value !== a.value ? 'La confirmation ne correspond pas.' : 'Mot de passe valide.');
        if (onok) onok(r.ok && a.value === b.value);
      }
      a.addEventListener('input', maj); b.addEventListener('input', maj); maj();
      return { val: function () { return a.value; }, ok: function () { return jauge(a.value, login, nom).ok && a.value === b.value; } };
    }

    /* ---------- écrans d'authentification ---------- */
    var gate = $('#gate');
    function gateErr(m) { var e = $('.err', gate); if (e) e.textContent = m || ''; }
    function masquerConnecte() {
      $('#app').classList.add('hidden'); $('#who').classList.add('hidden');
      $('#side').classList.add('hidden');
      document.body.classList.remove('has-side', 'side-open');
    }

    function finalise(s) {
      TOKEN = s.token;
      try { localStorage.setItem(STORE, TOKEN); } catch (e) {}
      if (s.doit_changer_mdp) { screenChanger(true); return; }
      boot();
    }
    function logout() {
      var t = TOKEN; TOKEN = null; CTX = null;
      try { localStorage.removeItem(STORE); } catch (e) {}
      if (t) rpc('deconnexion', { p_token: t }).catch(function () {});
      masquerConnecte();
      screenConnexion('Session terminée.');
    }

    function screenConnexion(hint, prefill) {
      masquerConnecte();
      gate.classList.remove('hidden');
      gate.innerHTML =
        '<div class="card"><h2>Connexion</h2><p class="sub" style="margin:0 0 14px">' + esc(hint || 'Accède à tes outils Soleco.') + '</p>' +
        '<label class="f">Identifiant</label><input id="lu" value="' + esc(prefill || '') + '" placeholder="prenom.nom@soleco.fr">' +
        '<label class="f">Mot de passe</label><input type="password" id="lp">' +
        '<div class="row" style="margin:12px 0;font-size:13px"><input type="checkbox" id="ll"> Rester connecté (30 jours)</div>' +
        '<button class="primary" id="lg" style="width:100%">Se connecter</button>' +
        '<div class="err"></div>' +
        '<p style="text-align:center;margin-top:10px"><span class="lnk" id="ld">Demander un accès</span></p></div>';
      var u = $('#lu', gate), p = $('#lp', gate);
      function go() {
        var l = u.value.trim(), m = p.value, lg = $('#ll', gate).checked;
        if (!l || !m) { gateErr('Identifiant et mot de passe requis.'); return; }
        gateErr(''); setStatus('Connexion…');
        rpc('connexion', { p_login: l, p_mdp: m, p_app: APP, p_longue: lg, p_ua: UA }).then(function (s) {
          setStatus('');
          if (s && s.mdp_a_definir) { screenDefinir(s.login, s.nom, lg); return; }
          finalise(s);
        }).catch(function (e) { setStatus(''); gateErr(e.message); });
      }
      $('#lg', gate).addEventListener('click', go);
      p.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      $('#ld', gate).addEventListener('click', function () { screenDemande(u.value.trim()); });
      setTimeout(function () { (prefill ? p : u).focus(); }, 40);
    }

    function screenDefinir(login, nom, longue) {
      gate.classList.remove('hidden');
      gate.innerHTML =
        '<div class="card"><h2>Créez votre mot de passe</h2>' +
        '<p class="sub" style="margin:0 0 6px">Compte <b>' + esc(login) + '</b> — première connexion.</p>' +
        mdpFields('d') +
        '<div class="row" style="margin:12px 0;font-size:13px"><input type="checkbox" id="dl"' + (longue ? ' checked' : '') + '> Rester connecté (30 jours)</div>' +
        '<button class="primary" id="dok" style="width:100%" disabled>Valider et se connecter</button>' +
        '<div class="err"></div></div>';
      var ok = $('#dok', gate);
      var c = mdpWire(gate, 'd', login, nom, function (v) { ok.disabled = !v; });
      ok.addEventListener('click', function () {
        if (!c.ok()) return; ok.disabled = true; setStatus('Création…'); gateErr('');
        rpc('definir_mdp_initial', { p_login: login, p_mdp: c.val(), p_app: APP, p_longue: $('#dl', gate).checked, p_ua: UA })
          .then(finalise).catch(function (e) { setStatus(''); ok.disabled = false; gateErr(e.message); });
      });
    }

    function screenChanger(oblig) {
      gate.classList.remove('hidden');
      var login = (CTX && CTX.login) || '', nom = (CTX && CTX.nom) || '';
      gate.innerHTML =
        '<div class="card"><h2>' + (oblig ? 'Changement requis' : 'Changer mon mot de passe') + '</h2>' +
        (oblig ? '<p class="sub" style="margin:0 0 6px">Un administrateur a demandé le renouvellement.</p>' : '') +
        '<label class="f">Mot de passe actuel</label><input type="password" id="cc">' +
        mdpFields('c') +
        '<button class="primary" id="cok" style="width:100%;margin-top:6px" disabled>Valider</button>' +
        (oblig ? '' : '<button id="cx" style="width:100%;margin-top:8px">Annuler</button>') +
        '<div class="err"></div></div>';
      var ok = $('#cok', gate);
      var c = mdpWire(gate, 'c', login, nom, function (v) { ok.disabled = !(v && $('#cc', gate).value); });
      $('#cc', gate).addEventListener('input', function () { ok.disabled = !(c.ok() && this.value); });
      ok.addEventListener('click', function () {
        ok.disabled = true; setStatus('Enregistrement…'); gateErr('');
        rpc('changer_mdp', { p_token: TOKEN, p_ancien: $('#cc', gate).value, p_nouveau: c.val() }).then(function () {
          setStatus(''); boot();
        }).catch(function (e) { setStatus(''); ok.disabled = false; gateErr(e.message); });
      });
      var x = $('#cx', gate); if (x) x.addEventListener('click', boot);
    }

    function screenDemande(prefill) {
      gate.classList.remove('hidden');
      gate.innerHTML =
        '<div class="card"><h2>Demander un accès</h2>' +
        '<p class="sub" style="margin:0 0 6px">Transmis à un administrateur pour validation. Adresses @soleco.fr ou déjà connues.</p>' +
        '<label class="f">Adresse e-mail</label><input id="qu" value="' + esc(prefill || '') + '">' +
        '<label class="f">Nom et prénom</label><input id="qn">' +
        '<button class="primary" id="qok" style="width:100%">Envoyer la demande</button>' +
        '<button id="qb" style="width:100%;margin-top:8px">Retour</button>' +
        '<div class="err"></div></div>';
      $('#qb', gate).addEventListener('click', function () { screenConnexion(); });
      $('#qok', gate).addEventListener('click', function () {
        var l = $('#qu', gate).value.trim();
        if (!l) { gateErr('Adresse requise.'); return; }
        gateErr(''); setStatus('Envoi…');
        rpc('demande_acces', { p_login: l, p_nom: $('#qn', gate).value.trim(), p_ua: UA }).then(function (r) {
          setStatus('');
          screenConnexion(r.etat === 'cree' ? 'Demande enregistrée. Un administrateur doit valider ton compte.'
            : r.etat === 'en_attente' ? 'Une demande est déjà en attente.'
            : 'Ce compte existe déjà — connecte-toi.');
        }).catch(function (e) { setStatus(''); gateErr(e.message); });
      });
    }

    function screenBlocage(msg) {
      gate.classList.remove('hidden');
      gate.innerHTML = '<div class="card"><h2>Accès refusé</h2><p class="sub" style="margin:0 0 12px">' +
        esc(msg || 'Ton compte n\'a pas accès au portail.') + '</p>' +
        '<button class="primary" id="bo" style="width:100%">Se déconnecter</button></div>';
      $('#bo', gate).addEventListener('click', logout);
    }

    /* ---------- portail connecté ---------- */
    function boot() {
      if (!TOKEN) { screenConnexion(); return; }
      setStatus('Chargement…');
      rpc('session_valide', { p_token: TOKEN, p_app: APP }).then(function (s) {
        if (s.doit_changer_mdp) { CTX = s; screenChanger(true); return Promise.reject({ handled: true }); }
        CTX = s;
        return rpc('mes_applications', { p_token: TOKEN });
      }).then(function (apps) {
        setStatus('');
        gate.classList.add('hidden'); gate.innerHTML = '';
        var admin = CTX.role === 'admin';
        renderIdentite(admin);
        renderTiles(apps || []);
        $('#side').classList.toggle('hidden', !admin);
        document.body.classList.toggle('has-side', admin);
        if (admin) { renderAdmin(); }
        showPanel('accueil');
        $('#app').classList.remove('hidden');
      }).catch(function (e) {
        setStatus('');
        if (e && e.handled) return;
        var m = (e && e.message) || '';
        if (/pas acc[eè]s|acc[eè]s à cet/i.test(m)) { screenBlocage(m); }
        else if (/session/i.test(m)) { logout(); }
        else { screenConnexion(m); }
      });
    }

    function renderIdentite(admin) {
      var w = $('#who');
      w.classList.remove('hidden');
      w.innerHTML = '<b>' + esc(CTX.nom || CTX.login) + '</b>' +
        '<span>' + esc(CTX.role) + ' N' + (CTX.niveau || 1) + '</span>' +
        '<button class="small" data-mdp>Mot de passe</button>' +
        '<button class="small" data-out>Déconnexion</button>';
      w.querySelector('[data-mdp]').addEventListener('click', function () { screenChanger(false); });
      w.querySelector('[data-out]').addEventListener('click', logout);
      $('#sideVersion').textContent = VERSION;
    }

    [].forEach.call(document.querySelectorAll('#sideNav button'), function (b) {
      b.addEventListener('click', function () {
        showPanel(b.getAttribute('data-panel'));
        document.body.classList.remove('side-open');
      });
    });
    $('#menuToggle').addEventListener('click', function () { document.body.classList.toggle('side-open'); });
    function showPanel(name) {
      ['accueil', 'comptes', 'applications', 'apercu', 'gestion'].forEach(function (p) {
        var el = document.getElementById('view-' + p);
        if (el) el.classList.toggle('hidden', p !== name);
      });
      [].forEach.call(document.querySelectorAll('#sideNav button'), function (b) {
        b.classList.toggle('active', b.getAttribute('data-panel') === name);
      });
      if (name === 'gestion') renderGestion();
    }

    function renderTiles(apps) {
      var list = apps.filter(function (a) { return a.code !== APP && a.url; });
      var g = $('#tiles');
      if (!list.length) { g.innerHTML = '<p class="sub">Aucune application ne t\'est attribuée pour le moment.</p>'; return; }
      g.innerHTML = list.map(function (a) {
        return '<button class="tile" data-code="' + esc(a.code) + '">' +
          '<div class="kicker">' + esc(a.kicker || 'Outil') + '</div>' +
          '<h3>' + esc(a.libelle) + '</h3>' +
          '<p>' + esc(a.description || '') + '</p>' +
          '<div class="go"><span>Ouvrir</span><span class="arrow">↗</span></div></button>';
      }).join('');
      [].forEach.call(g.querySelectorAll('[data-code]'), function (b) {
        b.addEventListener('click', function () {
          var code = b.getAttribute('data-code');
          var app = list.filter(function (x) { return x.code === code; })[0];
          if (!app.relais) { window.open(app.url, '_blank', 'noopener'); return; }
          setStatus('Ouverture…'); b.disabled = true;
          rpc('jeton_relais', { p_token: TOKEN, p_app_cible: code }).then(function (r) {
            setStatus(''); b.disabled = false;
            var u = app.url + (app.url.indexOf('?') < 0 ? '?' : '&') + 'h=' + encodeURIComponent(r.code);
            window.open(u, '_blank', 'noopener');
          }).catch(function (e) {
            setStatus(''); b.disabled = false;
            if (/pas acc[eè]s/i.test(e.message)) { alert(e.message); }
            else { window.open(app.url, '_blank', 'noopener'); }
          });
        });
      });
    }

    /* ---------- administration ---------- */
    var APPS_ = [];
    function renderAdmin() {
      Promise.all([
        rpc('admin_utilisateurs', { p_token: TOKEN }),
        rpc('admin_applications', { p_token: TOKEN })
      ]).then(function (res) {
        var users = res[0] || []; APPS_ = res[1] || [];
        renderApercu(users); renderComptes(users); renderApps();
      }).catch(function (e) { $('#adminComptes').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
    }

    function appAccess(u, app) {
      var o = (u.applications || {})[app.code];
      return (o === undefined) ? app.ouvert_par_defaut : o;
    }

    function renderApercu(users) {
      var host = $('#adminApercu');
      var opts = users.slice().sort(function (a, b) { return a.login < b.login ? -1 : 1; })
        .map(function (u) {
          return '<option value="' + esc(u.login) + '">' + esc(u.login) +
            ' — ' + esc(u.role) + ' N' + (u.niveau || 1) + (u.valide ? '' : ' · à valider') + '</option>';
        }).join('');
      host.innerHTML =
        '<div class="row" style="gap:8px"><span class="sub">Voir le portail comme&nbsp;:</span>' +
        '<select id="ap-u" style="max-width:340px">' + opts + '</select></div>' +
        '<div id="ap-out" style="margin-top:10px"></div>';
      function draw() {
        var u = users.filter(function (x) { return x.login === $('#ap-u', host).value; })[0];
        if (!u) { $('#ap-out', host).innerHTML = ''; return; }
        var admin = u.role === 'admin';
        var autres = APPS_.filter(function (a) { return a.code !== APP; });
        var vis = autres.filter(function (a) { return a.actif && (admin || appAccess(u, a)); });
        var cache = autres.filter(function (a) { return vis.indexOf(a) < 0; });
        var rowP = APPS_.filter(function (a) { return a.code === APP; })[0] || { ouvert_par_defaut: true };
        var portail = admin || appAccess(u, rowP);
        function pills(l, cls) {
          return l.length ? l.map(function (a) { return '<span class="tag ' + cls + '">' + esc(a.libelle) + '</span>'; }).join(' ') : '<span class="sub">—</span>';
        }
        $('#ap-out', host).innerHTML =
          (u.valide ? '' : '<p class="err" style="margin:0 0 8px">Ce compte n\'est pas validé : il ne peut pas se connecter du tout.</p>') +
          (portail ? '' : '<p class="err" style="margin:0 0 8px">Ce compte n\'a pas accès au portail lui-même.</p>') +
          '<p style="margin:0 0 4px"><b>Tuiles affichées</b> ' + (admin ? '<span class="sub">(admin : tout)</span>' : '') + '</p>' +
          '<p style="margin:0 0 10px">' + pills(vis, 'ok') + '</p>' +
          '<p style="margin:0 0 4px"><b>Masquées</b></p><p style="margin:0 0 10px">' + pills(cache, '') + '</p>' +
          '<p class="sub" style="margin:0">Réglage par appli dans « Applications » (ouvert par défaut / accès sur attribution).</p>';
      }
      $('#ap-u', host).addEventListener('change', draw);
      draw();
    }

    function renderComptes(users) {
      var attente = users.filter(function (u) { return !u.valide; });
      var actifs = users.filter(function (u) { return u.valide; });
      function ligne(u) {
        var badge = !u.valide ? '<span class="tag warn">à valider</span>'
          : u.bloque ? '<span class="tag warn">bloqué</span>'
          : !u.actif ? '<span class="tag">désactivé</span>' : '<span class="tag ok">actif</span>';
        var apps = APPS_.filter(function (a) { return appAccess(u, a); }).map(function (a) { return a.code; }).join(', ');
        return '<tr data-u="' + esc(u.login) + '"><td>' + esc(u.login) + '</td>' +
          '<td>' + esc(u.contact_nom || u.nom || '') + '</td>' +
          '<td>' + esc(u.role) + ' N' + (u.niveau || 1) + '</td><td>' + badge + '</td>' +
          '<td>' + esc(apps || (u.role === 'admin' ? 'toutes' : '—')) + '</td>' +
          '<td>' + esc(String(u.derniere_connexion_le || '').slice(0, 16).replace('T', ' ')) + '</td>' +
          '<td><button class="small" data-edit>Modifier</button></td></tr>';
      }
      function tbl(l) {
        return '<div class="tablewrap"><table><thead><tr><th>Identifiant</th><th>Contact</th><th>Rôle</th>' +
          '<th>État</th><th>Applications</th><th>Dernière connexion</th><th></th></tr></thead><tbody>' +
          l.map(ligne).join('') + '</tbody></table></div>';
      }
      var host = $('#adminComptes');
      host.innerHTML =
        (attente.length ? '<p class="err" style="margin:0 0 6px">' + attente.length + ' compte(s) en attente de validation</p>' + tbl(attente) + '<div style="height:12px"></div>' : '') +
        '<div class="row" style="margin-bottom:8px;justify-content:flex-end;gap:8px;flex-wrap:wrap">' +
        '<button class="small" id="c-tech">Créer des comptes techniciens…</button>' +
        '<button class="small primary" id="c-new">+ Nouveau compte</button></div>' +
        tbl(actifs);
      $('#c-new', host).addEventListener('click', function () { editCompte(null); });
      $('#c-tech', host).addEventListener('click', modalTech);
      [].forEach.call(host.querySelectorAll('[data-u] [data-edit]'), function (b) {
        b.addEventListener('click', function () {
          var login = b.closest('[data-u]').getAttribute('data-u');
          editCompte(users.filter(function (x) { return x.login === login; })[0]);
        });
      });
    }

    function dlg(html) {
      var d = $('#dlg'); d.innerHTML = html; d.showModal();
      d.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', function () { d.close(); }); });
      return d;
    }

    function editCompte(u) {
      var creation = !u;
      u = u || { login: '', nom: '', role: 'lecteur', niveau: 1, actif: true, valide: true, applications: {} };
      var d = dlg(
        '<h2 style="margin-top:0">' + (creation ? 'Nouveau compte' : esc(u.login)) + '</h2>' +
        '<label class="f">Identifiant (e-mail)</label><input id="e-login" value="' + esc(u.login) + '"' + (creation ? '' : ' readonly') + '>' +
        '<label class="f">Nom</label><input id="e-nom" value="' + esc(u.nom || '') + '">' +
        '<div class="row" style="gap:10px"><div style="flex:1"><label class="f">Rôle</label>' +
        '<select id="e-role">' + ['lecteur', 'editeur', 'admin'].map(function (r) {
          return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>';
        }).join('') + '</select></div>' +
        '<div style="flex:1"><label class="f">Niveau</label><select id="e-niv">' +
        [1, 2, 3, 4].map(function (n) { return '<option' + (u.niveau === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
        '</select></div></div>' +
        '<div class="row" style="margin-top:12px;font-size:13px"><input type="checkbox" id="e-val"' + (u.valide ? ' checked' : '') + '> <b>Compte validé</b> (sinon connexion impossible)</div>' +
        '<div class="row" style="margin-top:6px;font-size:13px"><input type="checkbox" id="e-act"' + (u.actif ? ' checked' : '') + '> Actif</div>' +
        '<label class="f">Applications autorisées</label><div style="display:flex;flex-wrap:wrap;gap:10px">' +
        APPS_.map(function (a) {
          return '<label style="font-size:13px"><input type="checkbox" data-app="' + esc(a.code) + '"' +
            (appAccess(u, a) ? ' checked' : '') + '> ' + esc(a.code) + '</label>';
        }).join('') + '</div>' +
        (creation ? '' :
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="small" data-act="reset_mdp">Réinit. mot de passe</button>' +
          (u.bloque ? '<button class="small" data-act="debloquer">Débloquer</button>' : '') +
          '<button class="small" data-act="forcer_changement">Forcer changement</button>' +
          (u.sessions ? '<button class="small" data-deco>Déconnecter (' + u.sessions + ')</button>' : '') +
          (!u.valide && !u.mdp_defini ? '<button class="small" data-refuse>Refuser</button>' : '') +
          '</div>') +
        '<div class="err" id="e-err"></div>' +
        '<div style="margin-top:14px;text-align:right"><button data-x>Annuler</button> ' +
        '<button class="primary" id="e-ok">Enregistrer</button></div>');

      function err(e) { $('#e-err', d).textContent = (e && e.message) || e; }
      $('#e-ok', d).addEventListener('click', function () {
        var login = $('#e-login', d).value.trim();
        if (!login) { err('Identifiant requis.'); return; }
        var apps = {};
        d.querySelectorAll('[data-app]').forEach(function (c) { apps[c.getAttribute('data-app')] = c.checked; });
        setStatus('Enregistrement…');
        rpc('admin_maj_utilisateur', { p_token: TOKEN, p_login: login, p_donnees: {
          nom: $('#e-nom', d).value || null, role: $('#e-role', d).value,
          niveau: Number($('#e-niv', d).value), actif: $('#e-act', d).checked,
          valide: $('#e-val', d).checked, applications: apps
        } }).then(function () { setStatus(''); d.close(); renderAdmin(); }).catch(function (e) { setStatus(''); err(e); });
      });
      d.querySelectorAll('[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-act'); var o = {}; o[k] = true;
          rpc('admin_maj_utilisateur', { p_token: TOKEN, p_login: u.login, p_donnees: o })
            .then(function () { d.close(); renderAdmin(); }).catch(err);
        });
      });
      var dc = d.querySelector('[data-deco]');
      if (dc) dc.addEventListener('click', function () {
        rpc('admin_deconnecter', { p_token: TOKEN, p_login: u.login }).then(function () { d.close(); renderAdmin(); }).catch(err);
      });
      var rf = d.querySelector('[data-refuse]');
      if (rf) rf.addEventListener('click', function () {
        if (!confirm('Refuser et supprimer la demande de ' + u.login + ' ?')) return;
        rpc('admin_refuser_demande', { p_token: TOKEN, p_login: u.login }).then(function () { d.close(); renderAdmin(); }).catch(err);
      });
    }

    function modalTech() {
      var d = dlg('<h2 style="margin-top:0">Créer des comptes techniciens</h2>' +
        '<p class="sub">Coche les sociétés à importer. Un compte non validé (lecteur N2) ' +
        'est créé pour chaque technicien avec une adresse e-mail et sans compte.</p>' +
        '<div id="t-liste" class="sub">Analyse…</div><p class="err" id="t-err"></p>' +
        '<div style="margin-top:12px;text-align:right"><button data-x>Fermer</button> ' +
        '<button class="primary" id="t-go" disabled>Créer</button></div>');
      var go = $('#t-go', d), groupes = [];
      function ids() { return [].map.call(d.querySelectorAll('[data-g]:checked'), function (c) { return c.getAttribute('data-g'); }); }
      function recalc() {
        var n = ids().reduce(function (s, id) {
          var g = groupes.filter(function (x) { return String(x.tiers_id || '') === id; })[0];
          return s + (g ? g.a_creer : 0);
        }, 0);
        go.disabled = !n; go.textContent = n ? ('Créer ' + n + ' compte(s)') : 'Créer';
      }
      rpc('admin_techniciens_groupes', { p_token: TOKEN }).then(function (rows) {
        groupes = rows || [];
        if (!groupes.length) { $('#t-liste', d).textContent = 'Aucun technicien référencé.'; return; }
        $('#t-liste', d).innerHTML =
          '<table style="margin-top:6px"><thead><tr><th></th><th>Société</th>' +
          '<th style="text-align:center">À créer</th><th style="text-align:center">Déjà</th>' +
          '<th style="text-align:center">Sans e-mail</th></tr></thead><tbody>' +
          groupes.map(function (g) {
            var ok = g.a_creer > 0;
            return '<tr><td><input type="checkbox" data-g="' + esc(String(g.tiers_id || '')) + '"' + (ok ? '' : ' disabled') + '></td>' +
              '<td>' + esc(g.societe) + '</td>' +
              '<td style="text-align:center">' + (ok ? '<b>' + g.a_creer + '</b>' : '0') + '</td>' +
              '<td style="text-align:center">' + g.deja + '</td>' +
              '<td style="text-align:center">' + g.sans_email + '</td></tr>';
          }).join('') + '</tbody></table>';
        d.querySelectorAll('[data-g]').forEach(function (c) { c.addEventListener('change', recalc); });
      }).catch(function (e) { $('#t-liste', d).textContent = e.message; });
      go.addEventListener('click', function () {
        var g = ids(); if (!g.length) return;
        go.disabled = true; $('#t-err', d).textContent = '';
        rpc('admin_creer_comptes_techniciens', { p_token: TOKEN, p_groupes: g, p_dry_run: false })
          .then(function () { d.close(); renderAdmin(); })
          .catch(function (e) { $('#t-err', d).textContent = e.message; go.disabled = false; });
      });
    }

    function renderApps() {
      var host = $('#adminApps');
      host.innerHTML = '<div class="tablewrap"><table><thead><tr><th>Code</th><th>Libellé</th><th>Kicker</th>' +
        '<th>Description</th><th>URL</th><th>Ouvert</th><th title="Relais de session ?h=">Relais</th><th>Actif</th></tr></thead><tbody>' +
        APPS_.map(function (a) {
          return '<tr data-k="' + esc(a.code) + '"><td><code>' + esc(a.code) + '</code></td>' +
            '<td><input data-c="libelle" value="' + esc(a.libelle) + '" style="min-width:110px"></td>' +
            '<td><input data-c="kicker" value="' + esc(a.kicker || '') + '" style="min-width:90px"></td>' +
            '<td><input data-c="description" value="' + esc(a.description || '') + '" style="min-width:180px"></td>' +
            '<td><input data-c="url" value="' + esc(a.url || '') + '" style="min-width:150px"></td>' +
            '<td style="text-align:center"><input type="checkbox" data-c="ouvert_par_defaut"' + (a.ouvert_par_defaut ? ' checked' : '') + '></td>' +
            '<td style="text-align:center"><input type="checkbox" data-c="relais"' + (a.relais ? ' checked' : '') + '></td>' +
            '<td style="text-align:center"><input type="checkbox" data-c="actif"' + (a.actif ? ' checked' : '') + '></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="row" style="margin-top:8px;gap:8px"><input id="na-code" placeholder="CODE" style="max-width:120px">' +
        '<input id="na-lib" placeholder="Libellé" style="max-width:220px">' +
        '<button class="small" id="na-add">+ Ajouter</button>' +
        '<span style="flex:1"></span><button class="small primary" id="a-save">Enregistrer</button></div>';
      $('#a-save', host).addEventListener('click', function () {
        var byK = {};
        host.querySelectorAll('[data-k] [data-c]').forEach(function (el) {
          var k = el.closest('[data-k]').getAttribute('data-k'), c = el.getAttribute('data-c');
          (byK[k] = byK[k] || {})[c] = (el.type === 'checkbox') ? el.checked : el.value;
        });
        var codes = Object.keys(byK);
        setStatus('Enregistrement…');
        Promise.all(codes.map(function (k) {
          return rpc('admin_maj_application', { p_token: TOKEN, p_code: k, p_donnees: byK[k] });
        })).then(function () { setStatus(''); renderAdmin(); }).catch(function (e) { setStatus(''); alert(e.message); });
      });
      $('#na-add', host).addEventListener('click', function () {
        var code = ($('#na-code', host).value || '').trim().toUpperCase();
        if (!code) return;
        rpc('admin_maj_application', { p_token: TOKEN, p_code: code, p_donnees: { libelle: $('#na-lib', host).value || code } })
          .then(renderAdmin).catch(function (e) { alert(e.message); });
      });
    }

    /* ---------- Gestion de la page ---------- */
    function renderGestion() {
      var host = $('#gestion');
      host.innerHTML = '<p class="sub">Chargement…</p>';
      rpc('portail_config_lire', {}).then(function (rows) {
        CFG = rows || [];
        var groupes = [['textes', 'Textes'], ['police', 'Police'],
          ['couleurs_clair', 'Couleurs — thème clair'], ['couleurs_sombre', 'Couleurs — thème sombre']];
        host.innerHTML = groupes.map(function (g) {
          var items = CFG.filter(function (r) { return r.groupe === g[0]; });
          if (!items.length) return '';
          return '<h3>' + esc(g[1]) + '</h3><div class="cfg-grid">' + items.map(champ).join('') + '</div>';
        }).join('') +
          '<p class="err" id="cfg-err"></p>' +
          '<div class="row" style="margin-top:14px;gap:8px"><button class="small" id="cfg-reset">Tout réinitialiser</button>' +
          '<span style="flex:1"></span><button class="primary" id="cfg-save">Enregistrer</button></div>';

        host.querySelectorAll('[data-hex]').forEach(function (hx) {
          var cle = hx.getAttribute('data-hex'), col = host.querySelector('[data-cle="' + cle + '"]');
          hx.addEventListener('input', function () { if (/^#[0-9a-fA-F]{6}$/.test(hx.value)) { col.value = hx.value; preview(); } });
          col.addEventListener('input', function () { hx.value = col.value; preview(); });
        });
        host.querySelectorAll('input[type="text"][data-cle], select[data-cle]').forEach(function (el) {
          el.addEventListener('input', preview);
        });

        function courant() {
          var o = {};
          host.querySelectorAll('[data-cle]').forEach(function (el) { o[el.getAttribute('data-cle')] = el.value; });
          return o;
        }
        function preview() { appliquerConfig(courant()); }

        $('#cfg-save', host).addEventListener('click', function () {
          var cur = courant(), ops = [];
          CFG.forEach(function (r) {
            if (!(r.cle in cur)) return;
            var v = cur[r.cle];
            var envoyer = (v === r.defaut) ? '' : v;      // = défaut -> on efface l'override
            if ((r.valeur || '') !== envoyer) ops.push([r.cle, envoyer]);
          });
          if (!ops.length) { $('#cfg-err', host).textContent = 'Rien à enregistrer.'; return; }
          setStatus('Enregistrement…');
          Promise.all(ops.map(function (o) {
            return rpc('portail_config_maj', { p_token: TOKEN, p_cle: o[0], p_valeur: o[1] });
          })).then(function () { setStatus(''); return chargerConfig(); }).then(renderGestion)
            .catch(function (e) { setStatus(''); $('#cfg-err', host).textContent = e.message; });
        });
        $('#cfg-reset', host).addEventListener('click', function () {
          if (!confirm('Remettre toutes les couleurs, la police et les textes par défaut ?')) return;
          setStatus('Réinitialisation…');
          rpc('portail_config_reset', { p_token: TOKEN }).then(function () { return chargerConfig(); })
            .then(function () { setStatus(''); renderGestion(); })
            .catch(function (e) { setStatus(''); $('#cfg-err', host).textContent = e.message; });
        });
      }).catch(function (e) { host.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
    }
    function champ(r) {
      var v = r.valeur || r.defaut;
      if (r.type === 'couleur') {
        return '<label class="cfg-item"><span>' + esc(r.libelle) + '</span>' +
          '<span class="row" style="gap:6px"><input type="color" data-cle="' + esc(r.cle) + '" value="' + esc(v) + '" style="width:46px">' +
          '<input type="text" data-hex="' + esc(r.cle) + '" value="' + esc(v) + '" style="width:100px"></span></label>';
      }
      if (r.type === 'police') {
        return '<label class="cfg-item"><span>' + esc(r.libelle) + '</span><select data-cle="' + esc(r.cle) + '">' +
          Object.keys(FONTS).map(function (k) { return '<option' + (v === k ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') +
          '</select></label>';
      }
      return '<label class="cfg-item"><span>' + esc(r.libelle) + '</span><input type="text" data-cle="' + esc(r.cle) + '" value="' + esc(v) + '"></label>';
    }

    /* ---------- démarrage ---------- */
    (function start() {
      chargerConfig();
      var h = new URLSearchParams(location.search).get('h');
      if (h) {
        history.replaceState(null, '', location.pathname);
        setStatus('Connexion…');
        rpc('echanger_relais', { p_code: h, p_app: APP, p_ua: UA }).then(finalise).catch(function () {
          setStatus(''); boot();
        });
        return;
      }
      boot();
    })();
  })();
  </script>
</body>
</html>
