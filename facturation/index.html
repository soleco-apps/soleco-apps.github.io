<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="2;url=/">
  <title>Facturation - Soleco Apps</title>
  <style>
    :root { --bg:#161616; --surface:#1e1e1e; --text:#ededed; --muted:#a8a8a8; --accent:#fcdc49; --border:rgba(255,255,255,.10); font-family:Arial, sans-serif; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body { display:grid; place-items:center; padding:24px; }
    main { max-width:520px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:22px; box-shadow:0 18px 40px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:22px; }
    p { margin:0 0 14px; color:var(--muted); line-height:1.45; }
    a { color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>Facturation</h1>
    <p>L'application Facturation est maintenant gérée dans Apps Script, comme les autres outils Soleco.</p>
    <p>Redirection vers le portail...</p>
    <a href="/">Retourner à Soleco Apps</a>
  </main>
  <script>setTimeout(function(){ location.replace('/'); }, 800);</script>
</body>
</html>
